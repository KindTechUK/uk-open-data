site_name: uk-open-data
site_description: >-
  UK open data in Python for charities, researchers and students: ONS
  boundaries, Nomis statistics, postcodes and deprivation indices, joined to
  your own data.
site_url: https://kindtechuk.github.io/uk-open-data/

# Repository information
repo_name: KindTechUK/uk-open-data
repo_url: https://github.com/KindTechUK/uk-open-data

theme:
  name: material
  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    # Top navigation bar
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top

    # Other features
    - navigation.instant
    - navigation.tracking
    - content.code.copy
    - content.tooltips
    - search.suggest
    - search.highlight
    - toc.follow
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

# Generate /llms.txt + /llms-full.txt and a "copy as Markdown" button per page
# (LLM-friendly docs). `search` is listed so Material's search stays enabled.
plugins:
  - search
  - llmstxt-md:
      markdown_description: |
        - Install with `uv add uk-open-data` and import `uk_open_data`. `kindtech` is the old name.
        - Statistics, postcode lookups, deprivation data and boundary properties (`geodata_to_properties`) share a `geography_code` column: join on it.
        - Loaders return the DataFrame library you have installed (polars if you have both), so install pandas or polars yourself. `load_geodata` returns GeoJSON.
        - The connector for chat assistants needs an extra: `uv add "uk-open-data[connector]"`, then `uk-open-data connector`.
      sections:
        Home:
          - index.md
        Examples:
          - examples.md
        Case Studies:
          - case-studies/*.md
        User Guide:
          - api/*.md
          - faq/README.md
        Blog:
          - blog/*.md

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - tables

# Navigation structure
nav:
  - Home: index.md
  - Examples: examples.md
  - Case Studies:
    - Overview: case-studies/index.md
    - CAL Vulnerable Client Analysis: case-studies/cal-vulnerable-client.md
    - SOBUS BAME referral mapping: case-studies/sobus-bame-analysis.md
    - Material Focus Recycling: case-studies/material-focus-recycling.md
    - Smart Works Women & Unemployment: case-studies/smart-works-woman-unemployment.md
    - Starlight Children's Foundation: case-studies/starlight-children-mapping.md
  - User Guide:
    - Overview: api/index.md
    - Geographic Data: api/geo.md
    - ONS Data: api/ons.md
    - Postcodes: api/postcodes.md
    - Deprivation (IMD): api/imd.md
    - Analyses: api/analyses.md
    - Command Line: api/cli.md
    - Connector for chat assistants: api/connector.md
    - Data Sources: api/data-sources.md
    - Package FAQ: faq/README.md
  - Blog:
    - blog/index.md
    - Introduction: blog/introduction.md
    - How We Found the APIs Behind UK Public Data: blog/api-discovery.md
