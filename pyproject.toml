[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "uk-open-data"
version = "0.2.0a1"
description = "UK open data in Python for civil society, from charities and community groups to researchers and students"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
keywords = [
    "uk",
    "open-data",
    "ons",
    "nomis",
    "census",
    "postcodes",
    "imd",
    "deprivation",
    "geospatial",
    "charity",
    "civil-society",
    "research",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "requests>=2.28",
    "narwhals>=2.18.0",
    "python-calamine>=0.2",
]

[project.scripts]
uk-open-data = "uk_open_data.cli:main"
kindtech = "uk_open_data.cli:main"

[project.urls]
Homepage = "https://github.com/KindTechUK/uk-open-data"
Documentation = "https://kindtechuk.github.io/uk-open-data/"
"llms.txt" = "https://kindtechuk.github.io/uk-open-data/llms.txt"
Repository = "https://github.com/KindTechUK/uk-open-data"
Issues = "https://github.com/KindTechUK/uk-open-data/issues"

[project.optional-dependencies]
connector = [
    "mcp>=2.3,<3",
    "pandas>=2.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
"uk_open_data.geo" = ["data/*.csv"]
"uk_open_data.ons" = ["data/*.csv"]

[dependency-groups]
dev = [
    "kindtech",
    "mcp>=2.3,<3",
    "mkdocs>=1.6.1",
    "mkdocs-llmstxt-md>=0.2.0",
    "mkdocs-material>=9.6.14",
    "pandas>=2.0.0",
    "prek>=0.3.5",
    "pytest>=8.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.12.0",
    "ty>=0.0.21",
]
ingestion = [
    "requests>=2.28",
]

[tool.uv.workspace]
members = ["packaging/kindtech"]

[tool.uv.sources]
kindtech = { workspace = true }

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "ERA"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"examples/*.py" = ["B018"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
