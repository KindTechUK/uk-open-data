name: Publish release to PyPI

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+rc[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+[ab][0-9]+"

permissions: {}

jobs:
  build:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false
          version: "0.12.6"

      - name: Verify tag matches both package versions
        run: |
          package_version="$(uv version --short)"
          old_name_version="$(uv version --short --package kindtech)"
          test "v${package_version}" = "${GITHUB_REF_NAME}"
          test "${old_name_version}" = "${package_version}"

      - name: Build distributions
        run: uv build --no-sources

      - name: Smoke-test wheel
        run: uv run --isolated --no-project --with dist/*.whl tests/smoke_test.py

      - name: Smoke-test source distribution
        run: uv run --isolated --no-project --with dist/*.tar.gz tests/smoke_test.py

      - name: Build distributions of the old name
        run: uv build --no-sources --package kindtech --out-dir dist-old-name

      - name: Smoke-test wheel of the old name
        run: >-
          uv run --isolated --no-project --with dist/*.whl
          --with dist-old-name/*.whl tests/old_name_smoke_test.py

      - name: Smoke-test source distribution of the old name
        run: >-
          uv run --isolated --no-project --with dist/*.tar.gz
          --with dist-old-name/*.tar.gz tests/old_name_smoke_test.py

      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distributions
          path: dist/

      - name: Upload distributions of the old name
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distributions-old-name
          path: dist-old-name/

  publish:
    name: Publish uk-open-data
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/uk-open-data/
    permissions:
      id-token: write
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false
          version: "0.12.6"

      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions
          path: dist/

      - name: Generate attestations
        uses: astral-sh/attest-action@39b6ce43875c196a579e31635b11aa2a2036384a # v0.0.7

      - name: Publish to PyPI
        run: uv publish

  # The old name depends on the same version of uk-open-data, so it is
  # published second.
  publish-old-name:
    name: Publish kindtech, the old name
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/kindtech/
    permissions:
      id-token: write
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false
          version: "0.12.6"

      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions-old-name
          path: dist/

      - name: Generate attestations
        uses: astral-sh/attest-action@39b6ce43875c196a579e31635b11aa2a2036384a # v0.0.7

      - name: Publish to PyPI
        run: uv publish
